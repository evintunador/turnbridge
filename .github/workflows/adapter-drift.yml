# Daily observation of historical format prefixes for the original three writers.
# This job reports drift; it never certifies versions or promotes pins. The
# integration-maintenance workflow separately tests candidate runtimes through
# real installed macOS/Linux PTYs and opens draft evidence proposals. Live model
# and provider certification remains a separate, explicitly configured tier.
name: adapter-drift
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
      report: ${{ steps.drift.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: drift
        run: node scripts/check-adapter-drift.mjs || [ $? -eq 2 ]

  file-issue:
    needs: check
    if: needs.check.outputs.drift == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.check.outputs.report }}
        with:
          script: |
            const title = "Adapter drift: target CLI released outside validated version range";
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "adapter-drift",
            });
            const body = process.env.REPORT +
              "\n\n_Automated by .github/workflows/adapter-drift.yml — updates daily while drift persists._";
            if (open.data.length > 0) {
              await github.rest.issues.update({
                ...context.repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["adapter-drift"],
              });
            }

  close-issue:
    needs: check
    if: needs.check.outputs.drift == 'false'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "adapter-drift",
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: "Every target CLI's latest release is back inside the adapters' validated version prefixes. Closing automatically.",
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: "closed",
              });
            }
