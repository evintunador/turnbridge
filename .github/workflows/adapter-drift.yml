  #   permissions:
  #     contents: write
  #     pull-requests: write
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: anthropics/claude-code-action@v1
  #       with:
  #         anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
  #         prompt: |
  #           ${{ needs.check.outputs.report }}
  #
  #           Install the drifted CLI release(s), re-verify the fabrication
  #           spec(s) named above against them (headless probes only), amend
  #           the spec docs and VALIDATED_VERSION_PREFIX if the format is
  #           unchanged, run `npm test`, and open a DRAFT pull request with
  #           your findings. If the format changed materially, do not guess:
  #           open the PR with the spec diff annotated as needing human
  #           validation via `npm run smoke:interactive`.
