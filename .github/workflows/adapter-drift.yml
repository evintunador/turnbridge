# Watches the target CLIs' npm releases and flags when they move outside the
# version prefixes the fabrication adapters were validated against
# (docs/specs/ are reverse-engineered and version-pinned by design).
#
# Daily check → open/update a pinned tracking issue on drift, close it when
# drift clears. Reporting only, deliberately: this workflow never writes to
# the repo and never opens a PR.
#
# Why not auto-draft the PR (considered and rejected 2026-08-02): CI cannot
# validate a pin. The probes that earn one need both target CLIs installed, a
# TTY for the interactive smoke test, and paid model credentials per provider
# to make the recall turns real. So any PR CI opened would be a mechanical
# one-line pin bump with nothing behind it — saving a trivial edit while
# creating a mergeable artifact that asserts a validation nobody performed.
# An issue cannot be merged; that asymmetry is the whole point. An agent-drafted
# PR (an earlier idea, needing an ANTHROPIC_API_KEY secret) hits the same wall
# for the same reason — the key was never the binding constraint.
name: adapter-drift
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
      report: ${{ steps.drift.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: drift
        run: node scripts/check-adapter-drift.mjs || [ $? -eq 2 ]

  file-issue:
    needs: check
    if: needs.check.outputs.drift == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.check.outputs.report }}
        with:
          script: |
            const title = "Adapter drift: target CLI released outside validated version range";
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "adapter-drift",
            });
            const body = process.env.REPORT +
              "\n\n_Automated by .github/workflows/adapter-drift.yml — updates daily while drift persists._";
            if (open.data.length > 0) {
              await github.rest.issues.update({
                ...context.repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["adapter-drift"],
              });
            }

  close-issue:
    needs: check
    if: needs.check.outputs.drift == 'false'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "adapter-drift",
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: "Every target CLI's latest release is back inside the adapters' validated version prefixes. Closing automatically.",
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: "closed",
              });
            }
